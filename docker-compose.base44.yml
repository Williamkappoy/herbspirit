services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kapibana
      POSTGRES_PASSWORD: kapibana_dev
      POSTGRES_DB: kapibana_tickets
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapibana -d kapibana_tickets"]
      interval: 5s
      timeout: 5s
      retries: 5

  setup:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://kapibana:kapibana_dev@db:5432/kapibana_tickets
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "apk add --no-cache openssl libc6-compat && npm install && npx prisma generate && npx prisma db push --skip-generate && npx tsx prisma/seed.ts"

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://kapibana:kapibana_dev@db:5432/kapibana_tickets
      - JWT_SECRET=dev-jwt-secret-change-me
      - COMMISSION_RATE=5
      - NODE_ENV=development
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - WATCHPACK_POLLING=true
    depends_on:
      setup:
        condition: service_completed_successfully
    command: sh -c "apk add --no-cache openssl libc6-compat && npx prisma generate && npm run dev"

volumes:
  pgdata:
  node_modules:
